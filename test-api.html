<!DOCTYPE html>
<html>
<head>
    <title>Token Usage API Test</title>
</head>
<body>
    <h1>Token Usage API Test</h1>
    <div id="result">Loading...</div>

    <script>
        fetch('http://localhost:3000/api/token-usage/summary')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = `
                    <h2>API Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h3>Summary:</h3>
                    <p>Total Tokens: ${data.data.totalTokens}</p>
                    <p>Prompt Tokens: ${data.data.promptTokens}</p>
                    <p>Completion Tokens: ${data.data.completionTokens}</p>
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `
                    <p style="color: red;">Error: ${error.message}</p>
                `;
            });
    </script>
</body>
</html>
