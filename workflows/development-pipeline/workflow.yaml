name: "development-pipeline"
description: "多 Agent 协作开发流程（使用 Claude Code External Agent）"

input_schema:
  requirement:
    type: string
    required: true

output_schema:
  requirement: object
  architecture: object
  implementation: object
  test: object

steps:
  - id: product-manager
    name: "需求分析"
    agent: claude-code-external
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
    output:
      requirement: "structuredOutput"

  - id: architect
    name: "架构设计"
    agent: claude-code-external
    depends_on: [product-manager]
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
    output:
      architecture: "structuredOutput"

  - id: developer
    name: "代码生成"
    agent: claude-code-external
    depends_on: [architect]
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
    output:
      implementation: "structuredOutput"
    on_failure:
      action: retry
      retry:
        maxAttempts: 3

  - id: tester
    name: "测试验证"
    agent: claude-code-external
    depends_on: [developer]
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
    output:
      test: "structuredOutput"
    on_failure:
      action: rollback
      rollback_to: developer
      message: "测试失败，重新开发"

output:
  requirement:
    from: "requirement"
  architecture:
    from: "architecture"
  implementation:
    from: "implementation"
  test:
    from: "test"
