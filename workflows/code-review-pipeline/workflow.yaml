name: "代码审查工作流"
description: "分析 -> 审查 -> 安全检查"

input_schema:
  code:
    type: string
    required: true
  language:
    type: string
    default: typescript

output_schema:
  analysis: object
  review: object
  security: object

steps:
  # Step 1: Code analysis
  - id: analysis
    name: "代码分析"
    agent: data-analyst
    input:
      code: "{{ input.code }}"
      language: "{{ input.language }}"
    output:
      analysisResult: "structuredOutput"

  # Step 2: Code review
  - id: review
    name: "代码审查"
    agent: code-reviewer
    depends_on: [analysis]
    input:
      code: "{{ input.code }}"
      analysis: "{{ analysisResult }}"
    output:
      reviewResult: "structuredOutput"

  # Step 3: Security audit
  - id: security
    name: "安全审计"
    agent: security-auditor
    depends_on: [review]
    input:
      code: "{{ input.code }}"
      review: "{{ reviewResult }}"
    output:
      securityResult: "structuredOutput"

# Map intermediate variables to final output
output:
  analysis:
    from: "analysisResult"
  review:
    from: "reviewResult"
  security:
    from: "securityResult"
