# Feedback Loop Workflow Example
#
# This workflow demonstrates all feedback loop features:
# - Automatic retry on transient failures
# - Human-in-the-loop (HITL) intervention
# - Rollback on critical failures
# - Combined strategies

name: "feedback-loop-demo"
description: "演示工作流反馈循环功能：重试、HITL、回滚"

version: "1.0.0"

# Input schema
input_schema:
  feature:
    type: string
    required: true
    description: "Feature name to develop"
  environment:
    type: string
    default: "staging"
    description: "Target environment"

# Output schema
output_schema:
  status:
    type: string
    description: "Final workflow status"
  deploymentUrl:
    type: string
    description: "Deployment URL (if successful)"

# Steps definition
steps:
  # Step 1: Analyze requirements
  # - Simple retry on transient network errors
  - id: analyze
    name: "需求分析"
    agent: developer
    retry:
      maxRetries: 2
      delayMs: 3000
      exponentialBackoff: true
    input:
      task: |
        Analyze requirements for feature: {{ feature }}
        Target environment: {{ environment }}

  # Step 2: Develop feature
  # - If development fails, rollback to analysis
  - id: develop
    name: "开发功能"
    agent: developer
    depends_on: [analyze]
    retry:
      maxRetries: 1
      delayMs: 5000
    on_failure: rollback
    rollbackConfig:
      targetStepId: analyze
      clearContext: false
    input:
      task: |
        Develop feature: {{ feature }}
        Based on analysis from previous step

  # Step 3: Unit tests
  # - If tests fail, request human decision
  - id: unit-test
    name: "单元测试"
    agent: developer
    depends_on: [develop]
    on_failure: hitl
    hitl:
      pollInterval: 10000     # 10 seconds
      timeout: 3600000        # 1 hour
      question: "单元测试失败，请选择处理方式"
      options:
        - id: fix-and-retry
          label: "修复后重试"
          description: "修复代码后重新运行单元测试"
          action: retry
          style: primary

        - id: ignore-and-continue
          label: "忽略测试失败"
          description: "跳过单元测试，继续集成测试"
          action: skip
          style: secondary

        - id: rollback-to-dev
          label: "回滚到开发"
          description: "重新开始开发阶段"
          action: rollback
          params:
            targetStepId: develop
          style: warning

        - id: abort
          label: "中止工作流"
          description: "取消整个工作流"
          action: abort
          style: danger
    input:
      task: "Run unit tests for feature: {{ feature }}"

  # Step 4: Integration tests
  # - No retry, fail fast
  - id: integration-test
    name: "集成测试"
    agent: developer
    depends_on: [unit-test]
    input:
      task: "Run integration tests"

  # Step 5: Deploy to staging
  # - Retry on deployment failures
  - id: deploy-staging
    name: "部署到测试环境"
    agent: developer
    depends_on: [integration-test]
    retry:
      maxRetries: 3
      delayMs: 10000
      exponentialBackoff: true
      maxDelayMs: 60000      # Max 1 minute
      jitterFactor: 0.2
    input:
      task: |
        Deploy {{ feature }} to {{ environment }}
        Configuration: standard

  # Step 6: Smoke tests
  # - Critical: rollback to deployment if smoke tests fail
  - id: smoke-test
    name: "冒烟测试"
    agent: developer
    depends_on: [deploy-staging]
    on_failure: rollback
    rollbackConfig:
      targetStepId: deploy-staging
    input:
      task: "Run smoke tests on deployed instance"

  # Step 7: Cleanup (always runs)
  # - Runs even if previous steps fail
  - id: cleanup
    name: "清理资源"
    agent: developer
    always_run: true
    input:
      task: "Clean up temporary resources"

# Final output mapping
output:
  status:
    from: "smoke-test.structuredOutput.status"
  deploymentUrl:
    from: "deploy-staging.structuredOutput.url"
    default: "N/A"

# Default values
defaults:
  retryOnNetworkErrors: true
  hitlTimeout: 86400000  # 24 hours
