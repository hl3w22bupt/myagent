name: "简单开发工作流"
description: "开发分析 -> 代码实现（使用 Claude Code External Agent）"

input_schema:
  requirement:
    type: string
    required: true

output_schema:
  plan: object
  implementation: object

steps:
  - id: plan
    name: "制定计划，不要直接写代码"
    agent: claude-code-external
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
    output:
      planResult: "structuredOutput"

  - id: implement
    name: "参考制定的计划，开始实现代码"
    agent: claude-code-external
    depends_on: [plan]
    externalAgent:
      type: claude
      protocol: acp
      timeout: 1800000  # 30 minutes
    input:
      requirement: "{{ input.requirement }}"
      plan: "{{ planResult }}"
    output:
      implementationResult: "structuredOutput"

# Map intermediate variables to final output
output:
  plan:
    from: "planResult"
  implementation:
    from: "implementationResult"
