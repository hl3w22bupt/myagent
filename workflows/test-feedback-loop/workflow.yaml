# Test Feedback Loop Workflow
# 简单的测试工作流，用于验证反馈循环功能

name: "test-feedback-loop"
description: "测试工作流反馈循环功能"

steps:
  # Step 1: 简单的任务（应该成功）
  - id: step1
    name: "第一步 - 分析任务"
    agent: developer
    input:
      task: "简单分析：1+1等于多少？"

  # Step 2: 会失败的任务，触发 HITL
  - id: step2
    name: "第二步 - 模拟失败"
    agent: developer
    depends_on: [step1]
    on_failure: hitl
    hitl:
      pollInterval: 5000     # 5秒轮询（测试用，短一点）
      timeout: 60000        # 1分钟超时（测试用）
      question: "步骤执行失败，请选择处理方式"
      options:
        - id: retry
          label: "重试"
          description: "重新执行此步骤"
          action: retry
          style: primary
        - id: skip
          label: "跳过"
          description: "跳过此步骤，继续执行"
          action: skip
          style: secondary
        - id: abort
          label: "中止"
          description: "中止整个工作流"
          action: abort
          style: danger
    input:
      task: "故意抛出错误：throw new Error('测试失败')"

  # Step 3: 如果前面跳过或成功，执行这步
  - id: step3
    name: "第三步 - 总结"
    agent: developer
    depends_on: [step2]
    input:
      task: "总结前面的执行结果"
