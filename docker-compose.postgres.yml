version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: motia-postgres
    environment:
      POSTGRES_DB: myagent
      POSTGRES_USER: myagent
      POSTGRES_PASSWORD: myagent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
