name: text-analyzer
description: Analyze text and provide detailed insights including sentiment, key topics, and suggestions
version: 1.0.0

type: pure-script

# 没有 execution 配置，使用 prompt_template
prompt_template: |
  Please analyze the following text and provide insights:

  Text: {text}

  Analysis Mode: {mode}

  Please provide:
  1. Overall sentiment (positive/negative/neutral)
  2. Key topics or themes identified
  3. Writing style assessment
  4. Suggestions for improvement (if any)

  Format your response as clear markdown with headings.

tags:
  - text
  - analysis
  - ai
