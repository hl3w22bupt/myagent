name: remotion-generator
version: 1.0.0
description: Generate videos using Remotion framework from natural language descriptions
tags: [remotion, video, animation, media-generation]
type: hybrid

input_schema:
  type: object
  properties:
    description:
      type: string
      description: Natural language description of the video to generate
    duration:
      type: number
      default: 10
      description: Video duration in seconds
    fps:
      type: number
      default: 30
      description: Frames per second
    resolution:
      type: string
      default: "1920x1080"
      description: Video resolution as WIDTHxHEIGHT
    style:
      type: string
      default: "minimal"
      enum: [minimal, corporate, animated, cinematic, presentation]
      description: Video style template
    output_format:
      type: string
      default: "mp4"
      enum: [mp4, webm, gif]
      description: Output video format
    quality:
      type: string
      default: "medium"
      enum: [low, medium, high, ultra]
      description: Video quality/encoding preset
  required: [description]

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [video, error]
      description: Type of result
    success:
      type: boolean
      description: Whether the video generation succeeded
    content:
      oneOf:
        - type: object
          required: [path, mime_type, duration, fps, resolution]
          properties:
            path:
              type: string
              description: "相对于 outputs/ 的路径,不含 outputs/ 前缀"
            mime_type:
              type: string
              enum: [video/mp4, video/webm, image/gif]
            size:
              type: number
              description: File size in bytes
            duration:
              type: number
              description: Video duration in seconds
            fps:
              type: number
              description: Frames per second
            resolution:
              type: string
              description: Video resolution (e.g., "1920x1080")
            codec:
              type: string
              description: Video codec (e.g., "h264", "vp9")
            thumbnail_path:
              type: string
              description: Thumbnail path (relative to outputs/)
        - type: object
          required: [error_code, message]
          properties:
            error_code:
              type: string
              enum: [validation_error, execution_error, timeout_error, resource_error, dependency_error, unknown_error]
            message:
              type: string
            details:
              type: object
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [style, format, quality, execution_time]
      properties:
        style:
          type: string
        format:
          type: string
        quality:
          type: string
        execution_time:
          type: number
          description: Execution time in milliseconds

prompt_template: |
  You are a Remotion video generation expert. Create a complete Remotion video based on the description.
  
  Video Requirements:
  Description: {{description}}
  Duration: {{duration}} seconds
  FPS: {{fps}}
  Resolution: {{resolution}}
  Style: {{style}}
  Output Format: {{output_format}}
  Quality: {{quality}}
  
  Generate a Remotion React component that:
  - Uses TypeScript with proper types
  - Follows Remotion best practices (deterministic, interpolated animations)
  - Creates a {{style}} style video
  - Renders for exactly {{duration}} seconds at {{fps}} fps
  - Uses {{resolution}} resolution
  - Exports proper Composition with durationInFrames = {{duration}} * {{fps}}
  - Includes professional animations and transitions
  - Is production-ready with error handling
  - Focuses on creating visually appealing content that matches the description
  
  Specific style requirements:
  - minimal: Clean, simple, focused on content
  - corporate: Professional, branded, suitable for business
  - animated: Dynamic, engaging, with motion graphics
  - cinematic: Dramatic, film-like, with lighting effects
  - presentation: Informational, clear, suitable for educational content
  
  Provide the complete Remotion component code below:

execution:
  handler: handler.py
  function: generate_video
  timeout: 600000
