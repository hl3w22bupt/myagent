name: remotion-generator
version: 1.0.0
description: Generate videos using Remotion framework from natural language descriptions. Generates visual content only (no audio). For videos with voice narration, use with volcano-tts + ffmpeg to merge audio.
tags: [remotion, video, animation, media-generation]
type: hybrid

input_schema:
  type: object
  properties:
    description:
      type: string
      description: Natural language description of the video to generate
    duration:
      type: number
      default: 10
      description: Video duration in seconds
    fps:
      type: number
      default: 30
      description: Frames per second
    resolution:
      type: string
      default: "1920x1080"
      description: Video resolution as WIDTHxHEIGHT
    style:
      type: string
      default: "minimal"
      enum: [minimal, corporate, animated, cinematic, presentation]
      description: Video style template
    output_format:
      type: string
      default: "mp4"
      enum: [mp4, webm, gif]
      description: Output video format
    quality:
      type: string
      default: "medium"
      enum: [low, medium, high, ultra]
      description: Video quality/encoding preset
  required: [description]

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [video, error]
      description: Type of result
    success:
      type: boolean
      description: Whether the video generation succeeded
    content:
      oneOf:
        - type: object
          required: [path, mime_type, duration, fps, resolution]
          properties:
            path:
              type: string
              description: "相对于 outputs/ 的路径,不含 outputs/ 前缀"
            mime_type:
              type: string
              enum: [video/mp4, video/webm, image/gif]
            size:
              type: number
              description: File size in bytes
            duration:
              type: number
              description: Video duration in seconds
            fps:
              type: number
              description: Frames per second
            resolution:
              type: string
              description: Video resolution (e.g., "1920x1080")
            codec:
              type: string
              description: Video codec (e.g., "h264", "vp9")
            thumbnail_path:
              type: string
              description: Thumbnail path (relative to outputs/)
        - type: object
          required: [error_code, message]
          properties:
            error_code:
              type: string
              enum: [validation_error, execution_error, timeout_error, resource_error, dependency_error, unknown_error]
            message:
              type: string
            details:
              type: object
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [style, format, quality, execution_time]
      properties:
        style:
          type: string
        format:
          type: string
        quality:
          type: string
        execution_time:
          type: number
          description: Execution time in milliseconds

prompt_template: |
  You are a Remotion expert generating educational videos. Follow these rules strictly:

  {{MUST_RULES}}

  {{FORBIDDEN_RULES}}

  {{RECOMMENDED_RULES}}

  {{ANIMATION_PRESETS}}

  {{SCENE_PATTERNS}}

  ## Task

  Create a complete Remotion video based on the description:

  Video Requirements:
  - Description: {{description}}
  - Duration: {{duration}} seconds ({{duration}} * {{fps}} = {{total_frames}} frames)
  - FPS: {{fps}}
  - Resolution: {{resolution}}
  - Style: {{style}}
  - Output Format: {{output_format}}
  - Quality: {{quality}}

  Generate a Remotion React component that:
  - STRICTLY follows all MUST rules above
  - AVOIDS all FORBIDDEN patterns above
  - Uses recommended patterns when applicable
  - Applies appropriate animation presets from animations, timing, and transitions rules
  - Follows scene structure patterns from compositions, sequencing, and trimming rules
  - Uses TypeScript with proper `type` definitions (not interface)
  - Creates a {{style}} style video
  - Exports proper Composition with durationInFrames = {{total_frames}}

  ## Style Guidelines

  For {{style}} style:
  {{#if style_minimal}}
  - Clean, simple, focused on content
  - Use minimal animations (smooth_entrance preset: damping: 200)
  - Color palette: monochrome or low contrast
  {{/if}}
  {{#if style_corporate}}
  - Professional, branded
  - Use moderate animations (snappy_ui preset: damping: 20, stiffness: 200)
  - Color palette: business colors (blue, gray)
  {{/if}}
  {{#if style_animated}}
  - Dynamic, engaging
  - Use extensive animations (bouncy_playful preset: damping: 8)
  - Color palette: vibrant, high contrast
  {{/if}}
  {{#if style_cinematic}}
  - Dramatic, film-like
  - Use slow, heavy animations (heavy_slow preset: damping: 15, stiffness: 80, mass: 2)
  - Color palette: dramatic, high contrast
  {{/if}}
  {{#if style_presentation}}
  - Informational, educational
  - Use moderate animations (smooth_entrance preset)
  - Color palette: educational (clear, readable)
  {{/if}}

  ## Output Format

  Return ONLY valid TypeScript code with:

  ```typescript
  // 1. Props definition (use type, not interface)
  export type MyCompProps = {
    title: string;
    // ...
  };

  // 2. Composition component
  export const MyComposition: React.FC<MyCompProps> = ({ title }) => {
    const frame = useCurrentFrame();
    const { fps } = useVideoConfig();

    // Use frame for ALL animations
    const opacity = interpolate(frame, [0, 30], [0, 1]);

    return (
      <AbsoluteFill style={{ opacity }}>
        {/* Content */}
      </AbsoluteFill>
    );
  };

  // 3. Register in Root.tsx
  export const RemotionRoot = () => {
    return (
      <Composition
        id="MyComposition"
        component={MyComposition}
        durationInFrames={{total_frames}}
        fps={{fps}}
        width={{width}}
        height={{height}}
      />
    );
  };
  ```

  Provide the complete Remotion TypeScript code below:

execution:
  handler: handler.py
  function: generate_video
  timeout: 600000
