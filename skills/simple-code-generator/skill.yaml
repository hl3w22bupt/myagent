name: simple-code-generator
version: 1.0.0
description: Generate simple example code snippets in various programming languages
tags: [code, generator, example]
type: pure-script

input_schema:
  type: object
  properties:
    task:
      type: string
      description: Task description
    context:
      type: object
      description: Additional context
      default: {}

output_schema:
  type: object
  properties:
    result_type:
      type: string
      enum: [code, error]
    success:
      type: boolean
    output:
      type: string
      description: Generated code
    language:
      type: string
      description: Programming language

execution:
  handler: handler.py
  function: execute
