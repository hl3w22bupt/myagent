name: web-search
version: 1.0.0
description: Search the web for information and return results
tags: [web, research, search]
type: hybrid

input_schema:
  type: object
  properties:
    query:
      type: string
      description: The search query string
    limit:
      type: number
      default: 5
      description: Maximum number of results
  required: [query]

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [table, mixed, error]
      description: Type of result
    success:
      type: boolean
      description: Whether the search succeeded
    content:
      oneOf:
        - type: object
          required: [type, title, columns, rows]
          properties:
            type:
              type: string
              enum: [search_results]
            title:
              type: string
            columns:
              type: array
              items:
                type: string
              description: Column headers
            rows:
              type: array
              items:
                type: array
                description: Table rows (each row is an array of cell values)
            total:
              type: number
              description: Total number of results
        - type: object
          required: [error_code, message]
          properties:
            error_code:
              type: string
              enum: [validation_error, execution_error, timeout_error, network_error, resource_error, unknown_error]
            message:
              type: string
            details:
              type: object
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [query, search_engine, result_count, execution_time]
      properties:
        query:
          type: string
        search_engine:
          type: string
        result_count:
          type: number
        execution_time:
          type: number
          description: Execution time in milliseconds

prompt_template: |
  You are a web search assistant. Search for "{{query}}" and return the top {{limit}} results.

execution:
  handler: handler.py
  function: execute
  timeout: 30000
