name: tool-write
version: 1.1.0
description: "Write content to a file. Supports natural language task or direct parameters."
tags: [file, io, filesystem, tool]
type: pure-script

input_schema:
  type: object
  properties:
    task:
      type: string
      description: "Natural language task description"
    file_path:
      type: string
      description: "Direct file path to write"
    content:
      type: string
      description: "Content to write to the file"

output_schema:
  type: object
  required:
    - success
    - result_type
    - content
    - output_files
  properties:
    success:
      type: boolean
      description: "Whether the operation succeeded"
    result_type:
      type: string
      description: "Type of result (text, error, etc.)"
    content:
      type: string
      description: "Success message or error details"
    output_files:
      type: array
      items:
        type: string
      description: "List of file paths that were written"
    metadata:
      type: object
      description: "Additional metadata (execution_time, skills_used, etc.)"

execution:
  handler: handler.py
  function: execute
