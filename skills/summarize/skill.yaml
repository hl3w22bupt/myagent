name: summarize
version: 1.0.0
description: Summarize text content
tags: [text, summarization, nlp]
type: hybrid

input_schema:
  type: object
  properties:
    content:
      type: string
      description: Text content to summarize
    max_length:
      type: number
      default: 100
      description: Maximum summary length in words
    style:
      type: string
      default: concise
      enum: [concise, detailed, bullet-points]
      description: Summary style
  required: [content]

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [text, error]
      description: Type of result
    success:
      type: boolean
      description: Whether the summarization succeeded
    content:
      oneOf:
        - type: object
          required: [text]
          properties:
            text:
              type: string
              description: Summary text
            format:
              type: string
              enum: [plain, markdown]
              description: Text format
            style:
              type: string
              description: Summary style used
        - type: object
          required: [error_code, message]
          properties:
            error_code:
              type: string
              enum: [validation_error, execution_error, resource_error, unknown_error]
            message:
              type: string
            details:
              type: object
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [original_length, summary_length, compression_ratio, style, execution_time]
      properties:
        original_length:
          type: number
          description: Original text length in words
        summary_length:
          type: number
          description: Summary length in words
        compression_ratio:
          type: number
          description: Compression ratio (summary_length / original_length)
        style:
          type: string
          description: Summary style used
        execution_time:
          type: number
          description: Execution time in milliseconds

prompt_template: |
  You are a text summarization expert. Please summarize the following content.

  Content:
  {{content}}

  Requirements:
  - Maximum length: {{max_length}} words
  - Style: {{style}}
  - Capture the key points and main ideas
  - Maintain accuracy and avoid hallucinations

  Provide a clear, concise summary below:

execution:
  handler: handler.py
  function: execute
  timeout: 30000
