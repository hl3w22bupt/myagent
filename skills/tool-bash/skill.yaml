name: tool-bash
version: 1.2.0
description: "Execute shell commands safely. Supports hybrid mode: natural language task (LLM generates command) OR direct command/args execution. Use for file system operations, listing files, searching content, and shell utilities."
tags: [tool, shell, bash, command, cli, executor, utility, file, filesystem, ls, find, grep, cat]
type: pure-script

input_schema:
  type: object
  required: []
  properties:
    task:
      type: string
      description: "Natural language task description. LLM will generate appropriate shell command (e.g., '列出 /tmp 目录的文件', '查找所有 .py 文件')"
    command:
      type: string
      description: "Shell command to execute (e.g., ls, find, grep, cat)"
    args:
      type: array
      items:
        type: string
      description: "Command arguments"
    env:
      type: object
      description: "Environment variables for the command"
    working_dir:
      type: string
      description: "Working directory for command execution"
    timeout:
      type: integer
      description: "Command timeout in seconds (default: 30)"
      default: 30
  description: |
    Execute shell commands safely with a whitelist mechanism. Returns raw text
    output and execution metadata. Use for file system operations, listing files,
    searching content, and shell utilities.

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [text, error]
      description: "Type of result"
    success:
      type: boolean
      description: "Whether the command succeeded"
    content:
      oneOf:
        - type: string
          description: "Raw text output"
        - type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [validation, execution, timeout, network, resource, permission, dependency, unknown]
            message:
              type: string
            details:
              type: string
            retryable:
              type: boolean
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [execution_time, command]
      properties:
        execution_time:
          type: number
          description: "Execution time in milliseconds"
        command:
          type: string
          description: "Full command that was executed"
        exit_code:
          type: integer
          description: "Command exit code"
        stdout_lines:
          type: integer
          description: "Number of lines in stdout"
        stderr_lines:
          type: integer
          description: "Number of lines in stderr"
        output_size:
          type: integer
          description: "Output size in bytes"
        truncated:
          type: boolean
          description: "Whether output was truncated"

execution:
  handler: handler.py
  function: execute_shell_command
  timeout: 120000
