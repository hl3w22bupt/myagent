name: tool-bash
version: 2.0.0
description: "Execute shell commands safely with PTY support for interactive CLI tools. Supports hybrid mode: natural language task (LLM generates command) OR direct command/args execution. Use for file system operations, external CLI tools (claude, codex, pi), and shell utilities."
tags: [tool, shell, bash, command, cli, executor, utility, file, filesystem, ls, find, grep, cat, pty, interactive, external-agent]
type: pure-script

input_schema:
  type: object
  required: []
  properties:
    task:
      type: string
      description: "Natural language task description. LLM will generate appropriate shell command (e.g., '列出 /tmp 目录的文件', '查找所有 .py 文件')"
    command:
      type: string
      description: "Shell command to execute (e.g., ls, find, grep, cat, claude, codex, pi)"
    args:
      type: array
      items:
        type: string
      description: "Command arguments"
    env:
      type: object
      description: "Environment variables for the command"
    working_dir:
      type: string
      description: "Working directory for command execution"
    timeout:
      type: integer
      description: "Command timeout in seconds (default: 30)"
      default: 30
    pty:
      type: boolean
      description: "Use pseudo-terminal for interactive CLI tools (required for claude, codex, pi)"
      default: false
    background:
      type: boolean
      description: "Run command in background, returns sessionId for long-running processes"
      default: false
  description: |
    Execute shell commands safely with PTY support for interactive CLI tools.
    Returns raw text output and execution metadata.

    **PTY Mode**: Set pty=true for external CLI tools like claude, codex, pi that require
    interactive terminal support. This is essential for the External Coding Agent Integration.

    **Background Mode**: Set background=true for long-running processes, returns sessionId.

output_schema:
  type: object
  required:
    - result_type
    - success
    - content
    - metadata
  properties:
    result_type:
      type: string
      enum: [text, error]
      description: "Type of result"
    success:
      type: boolean
      description: "Whether the command succeeded"
    content:
      oneOf:
        - type: string
          description: "Raw text output"
        - type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [validation, execution, timeout, network, resource, permission, dependency, unknown]
            message:
              type: string
            details:
              type: string
            retryable:
              type: boolean
            suggestions:
              type: array
              items:
                type: string
    metadata:
      type: object
      required: [execution_time, command]
      properties:
        execution_time:
          type: number
          description: "Execution time in milliseconds"
        command:
          type: string
          description: "Full command that was executed"
        exit_code:
          type: integer
          description: "Command exit code"
        stdout_lines:
          type: integer
          description: "Number of lines in stdout"
        stderr_lines:
          type: integer
          description: "Number of lines in stderr"
        output_size:
          type: integer
          description: "Output size in bytes"
        truncated:
          type: boolean
          description: "Whether output was truncated"

execution:
  runtime:
    # Phase 1: Functional dependencies
    requires:
      bins: ["bash"]
      config: ["sandbox.enabled"]

    # Phase 3: Resource requirements
    resources:
      cpus: 1
      memory: "512Mi"
      priority: 1

    # Phase 3: Platform requirements
    platform:
      os: ["linux", "darwin"]
      arch: ["x86_64", "arm64"]

  handler: handler.py
  function: execute_shell_command
  timeout: 120000
